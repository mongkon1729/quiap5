<svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="แผนที่แผนผังแสดงตำแหน่งภาคเหนือ ภาคกลาง ภาคตะวันออกเฉียงเหนือ และภาคใต้ของประเทศไทย">
  <rect x="0" y="0" width="300" height="400" fill="#fdfaf5"/>

  <rect x="90" y="20" width="90" height="90" rx="10" fill="#a9d4bd" stroke="#2f9e73" stroke-width="2"/>
  <text x="135" y="70" font-size="16" text-anchor="middle" fill="#1f4d38">ภาคเหนือ</text>

  <rect x="150" y="120" width="110" height="80" rx="10" fill="#f3d9a4" stroke="#c99a3c" stroke-width="2"/>
  <text x="205" y="165" font-size="15" text-anchor="middle" fill="#6b4c14">ภาคอีสาน</text>

  <rect x="70" y="150" width="90" height="90" rx="10" fill="#bcd8f0" stroke="#3d7db3" stroke-width="2"/>
  <text x="115" y="200" font-size="16" text-anchor="middle" fill="#1e4a6b">ภาคกลาง</text>

  <rect x="95" y="260" width="70" height="120" rx="10" fill="#e6b8c4" stroke="#b85a76" stroke-width="2"/>
  <text x="130" y="325" font-size="16" text-anchor="middle" fill="#6b2438">ภาคใต้</text>

  <text x="150" y="395" font-size="12" text-anchor="middle" fill="#6b6b6b">แผนผังแสดงตำแหน่งภาคโดยสังเขป (ไม่ใช่มาตราส่วนจริง)</text>
</svg>
