<!DOCTYPE html>
<html lang="th" translate="no">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="google" content="notranslate" />
<meta name="robots" content="noindex" />
<title>ห้องครู • ห้องติว ป.5</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Chonburi&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/teacher.css" />
</head>
<body class="teacher">

<div id="lockScreen" class="lock-wrap" hidden>
  <div class="lock card">
    <div id="lockArt" class="lock-art"></div>
    <h1>ห้องครู</h1>
    <p>กรอกรหัสลับที่ตั้งไว้ใน Google Apps Script</p>
    <form id="lockForm" novalidate>
      <div class="field">
        <label for="lockKey">รหัสครู</label>
        <input id="lockKey" type="password" autocomplete="current-password" required />
      </div>
      <p id="lockError" class="error-text" hidden></p>
      <button type="submit" class="btn btn-primary">เข้าห้องครู</button>
      <a class="btn btn-ghost" href="./">กลับหน้านักเรียน</a>
    </form>
  </div>
</div>

<div id="dashShell" class="dash-shell" hidden>
  <div class="dash">
    <aside class="side">
      <a class="brand" href="teacher.html">ห้องครู<span>.</span></a>
      <nav class="nav" id="nav" aria-label="เมนูห้องครู"></nav>
      <div class="side-bottom">
        <div class="upgrade card">
          <strong>ดูหน้าที่นักเรียนเห็น</strong>
          <a class="btn" href="./">เปิดหน้านักเรียน</a>
        </div>
      </div>
    </aside>

    <main class="main">
      <div id="demoBanner" class="demo-banner card" hidden></div>
      <div id="view"></div>
    </main>

    <aside class="aside" id="aside"></aside>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/art.js"></script>
<script src="js/teacher.js"></script>
</body>
</html>
